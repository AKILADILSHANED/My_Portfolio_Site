<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akila Dilshan Edirisooriya | Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Akila Dilshan Edirisooriya: software engineer with ten years of finance experience, building full-stack apps with Java, Spring Boot, Next.js, React and MySQL."
    />
    <meta name="theme-color" content="#0d1321" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the saved theme before first paint (dark is the default) -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
